name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for the dev build (defaults to dev-<sha>)'
        required: false
        default: ''

permissions:
  contents: write   # needed for gh release create on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Resolve TAG
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=$TAG"

      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Show manifest
        run: cat dist/manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lo-wasm-${{ steps.tag.outputs.tag }}
          path: |
            lo-wasm-${{ steps.tag.outputs.tag }}.tar.gz
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Idempotent: if a release was already created out-of-band
          # (e.g. by a local dev cutting the first release with the
          # locally-built tarball), upload our artifacts on top with
          # --clobber. Either way the assets end up attached to the tag.

          # Read pins via jq to avoid shell-quoting headaches in the notes body.
          LO_COMMIT=$(jq -r .loCore versions.json)
          EMSDK_COMMIT=$(jq -r .emsdk versions.json)
          QT5_COMMIT=$(jq -r .qt5 versions.json)
          ZETAJS_NPM=$(jq -r .zetajsNpm versions.json)
          GIT_SHORT=$(git rev-parse --short HEAD)
          NOTES="Automated build from ${GIT_SHORT}.

          Component pins (see versions.json + manifest.json for sha256s):
          - LibreOffice  ${LO_COMMIT}
          - Emscripten   ${EMSDK_COMMIT}
          - Qt 5         ${QT5_COMMIT}
          - zetajs npm   ${ZETAJS_NPM}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets with --clobber."
            gh release upload "$TAG" \
              "lo-wasm-${TAG}.tar.gz" \
              "dist/manifest.json" \
              --clobber
          else
            gh release create "$TAG" \
              "lo-wasm-${TAG}.tar.gz" \
              "dist/manifest.json" \
              --title "lo-wasm $TAG" \
              --notes "$NOTES"
          fi
